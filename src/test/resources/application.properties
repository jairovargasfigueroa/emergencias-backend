# Configuración de las pruebas. Tapa al application.properties de src/main/resources, que no se versiona y lleva
# credenciales: las pruebas corren igual en cualquier computadora y en GitHub, sin internet ni cuentas.
# La base la pone Testcontainers (soporte/PostgisDePrueba): un PostGIS nuevo en Docker para cada corrida.
spring.application.name=ambulancias-backend
spring.jpa.hibernate.ddl-auto=create-drop

# Los mismos valores de negocio que la app.
sga.agrupacion.radio-m=150
sga.agrupacion.ventana-min=30
sga.posicion.persistir-cada-seg=30
sga.seguridad.horas-panel=12
sga.seguridad.dias-app=180
sga.seguridad.horas-codigo-activacion=24

# Clave que solo firma tokens de prueba.
sga.seguridad.secreto=clave-de-las-pruebas-del-backend-no-sirve-en-produccion

# Sin administrador sembrado: cada prueba arma el suyo.
sga.admin.correo=
sga.admin.clave=

# Lo externo, apagado: Firebase, el almacenamiento de archivos y el servicio de IA.
sga.firebase.habilitado=false
sga.evidencias.s3.bucket=
sga.ia.habilitado=false

# Los barridos periódicos no se repiten durante una corrida: así no se meten en lo que prueba cada caso.
sga.traslados.barrido-seg=86400
sga.evidencias.limpieza-cada-min=1440

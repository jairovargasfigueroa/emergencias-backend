# Corre todas las pruebas del backend en cada PR y en cada cambio que entra a develop.
# Las de integración (...IT) levantan PostGIS con Testcontainers: el runner de GitHub ya trae Docker.
name: Pruebas

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unitarias, integración y cobertura
        run: sh mvnw -B verify
      - name: Guardar los reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-de-pruebas
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco
